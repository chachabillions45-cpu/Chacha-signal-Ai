<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHACHA DERIV CONNECTION TEST</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:15px}
h2{color:#00e5a0;text-align:center}
.box{background:#1d293b;padding:15px;border-radius:12px;margin:12px 0}
button{width:100%;padding:15px;background:#00c98b;border:0;border-radius:8px;font-weight:bold}
select{width:100%;padding:12px;margin-top:12px}
#status{color:#ffd166;margin:12px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
</style>
</head>
<body>

<h2>CHACHA DERIV AI</h2>

<div class="box">
<div id="status">Not connected</div>
<button onclick="connectDeriv()">CONNECT TO DERIV</button>
<select id="markets">
<option>Waiting for markets...</option>
</select>
</div>

<div class="box">
<h3>DERIV RESPONSE</h3>
<pre id="output">Waiting for connection...</pre>
</div>

<script>
let ws;

function show(message){
 document.getElementById("status").textContent=message;
}

function connectDeriv(){
 if(ws) ws.close();

 show("Connecting...");

 ws=new WebSocket(
  "wss://api.derivws.com/trading/v1/options/ws/public"
 );

 ws.onopen=function(){
  show("Connected. Requesting market list...");
  ws.send(JSON.stringify({
   active_symbols:"full",
   req_id:1
  }));
 };

 ws.onmessage=function(event){
  let data;

  try{
   data=JSON.parse(event.data);
  }catch(e){
   document.getElementById("output").textContent=event.data;
   return;
  }

  document.getElementById("output").textContent=
   JSON.stringify(data,null,2);

  if(data.errors){
   show("Deriv returned an error.");
   return;
  }

  if(data.error){
   show("Deriv error: "+data.error.message);
   return;
  }

  if(data.msg_type==="active_symbols"){
   const all=data.active_symbols||[];

   const markets=all.filter(function(m){
    return (
     m.market==="synthetic_index" &&
     (m.underlying_symbol_name||"")
      .toLowerCase().includes("volatility")
    );
   });

   const select=document.getElementById("markets");
   select.innerHTML="";

   markets.forEach(function(m){
    const option=document.createElement("option");
    option.value=m.underlying_symbol;
    option.textContent=
     m.underlying_symbol_name+" ("+
     m.underlying_symbol+")";
    select.appendChild(option);
   });

   if(markets.length){
    show(markets.length+" Volatility markets found!");
   }else{
    show("Response received, but no matching markets found. See response below.");
   }
  }
 };

 ws.onerror=function(){
  show("Connection error. Check your internet connection.");
 };

 ws.onclose=function(){
  show("Connection closed.");
 };
}
</script>

</body>
</html>
